version: 2
publication:
  title: Magazine
  subtitle: PubForge starter project
  authors:
    - Your Name
  language: en
  type: magazine
  description: Editorial publication for image-led features and departments.

contents:
  toc: true
  landmarks: true

readingOrder:
  - path: content/01-start.md
    role: chapter
    title: Opening feature
  - path: content/02-main.md
    role: chapter
    title: Second feature
    breakBefore: page

theme:
  preset: magazine
  css: theme/publication.css

vfm:
  math: true
  mathRenderer: mathml
  footnote: dpub
  rewriteRelativeHrefExtensions: true

pdf:
  enabled: true
  profile: screen
  size: A4
  binding: left
  bookmarks: true

epub:
  enabled: true
  reflowable: true
  embeddedFonts: true

webpub:
  enabled: true

projectZip:
  enabled: true
