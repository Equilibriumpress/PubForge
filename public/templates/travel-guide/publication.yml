version: 2
publication:
  title: Travel Guide
  subtitle: PubForge starter project
  authors:
    - Your Name
  language: en
  type: travel-guide
  description: Destination guide with places, routes, maps and practical content.

contents:
  toc: true
  landmarks: true

readingOrder:
  - path: content/01-start.md
    role: chapter
    title: Destination overview
  - path: content/02-main.md
    role: chapter
    title: Places and routes
    breakBefore: page

theme:
  preset: travel-guide
  css: theme/publication.css

vfm:
  math: true
  mathRenderer: mathml
  footnote: dpub
  rewriteRelativeHrefExtensions: true
  parseFigcaptionAsInline: true

pdf:
  enabled: true
  profile: book
  size: A5
  binding: left
  bookmarks: true

epub:
  enabled: true
  reflowable: true
  embeddedFonts: true

webpub:
  enabled: true

projectZip:
  enabled: true
