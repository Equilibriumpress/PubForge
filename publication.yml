version: 2

publication:
  title: North Atlantic
  subtitle: Field Notes · Issue 01
  authors:
    - Equilibrium Press
    - PubForge
  language: en
  type: magazine
  identifier: urn:pubforge:north-atlantic:issue-01:2026
  publisher: Equilibrium Press
  description: An art-directed magazine fixture for testing image-led print, EPUB and Web Publication output.
  subjects:
    - magazine design
    - editorial photography
    - Atlantic
    - travel
  rights: © 2026 Equilibrium Press. Demonstration publication.
  date: 2026-10-04
  readingProgression: ltr

cover:
  image: examples/magazine-showcase/assets/dawn.svg
  alt: Abstract dawn over a dark Atlantic coastline

contents:
  toc: true
  tocTitle: In this issue
  sectionDepth: 2
  landmarks: true
  pageList: true

layout:
  mode: magazine
  columns: 3
  gutter: 5mm

readingOrder:
  - path: examples/magazine-showcase/content/01-cover.md
    role: title-page
    title: Cover
    layout: page
    pageName: cover
  - path: examples/magazine-showcase/content/02-opening.md
    role: chapter
    title: At the edge of weather
    layout: page
    pageName: cover
  - path: examples/magazine-showcase/content/03-feature.md
    role: chapter
    title: The long way west
    layout: page
    pageName: magazine
  - path: examples/magazine-showcase/content/04-people-left.md
    role: chapter
    title: Lives facing the sea
    layout: page
    pageName: spread-left
  - path: examples/magazine-showcase/content/04-people-right.md
    role: chapter
    title: Marta, harbour master
    layout: page
    pageName: spread-right
  - path: examples/magazine-showcase/content/05-gallery.md
    role: chapter
    title: Three ways to read a coast
    layout: page
    pageName: magazine
  - path: examples/magazine-showcase/content/06-colophon.md
    role: colophon
    title: Colophon
    layout: page
    pageName: magazine

theme:
  preset: magazine
  css: examples/magazine-showcase/theme/publication.css
  packages:
    - "@vivliostyle/theme-base@3.0.0"

assets:
  mermaid: true
  syntaxHighlighting: true
  shikiTheme: github-light
  imagePreflight:
    targetDpi: 300
  editorialImages:
    dawn:
      src: examples/magazine-showcase/assets/dawn.svg
      alt: Dawn above the North Atlantic with a dark coastal silhouette
      fit: cover
      focalPoint: 68% 38%
      bleed: full
      span: page
      position: full-page
    cliffs:
      src: examples/magazine-showcase/assets/cliffs.svg
      alt: Steep Atlantic cliffs under changing weather
      fit: cover
      focalPoint: 58% 48%
      bleed: full
      span: page
      position: full-page
    harbor:
      src: examples/magazine-showcase/assets/harbor.svg
      alt: Harbour buildings and piers arranged as strong geometric forms
      caption: Harbour geometry after the morning ferry
      credit: PubForge illustration
      fit: cover
      focalPoint: 50% 54%
      span: page
      printWidthMm: 175
    portrait:
      src: examples/magazine-showcase/assets/portrait.svg
      alt: Editorial portrait of a harbour master
      credit: PubForge illustration
      fit: cover
      focalPoint: 52% 36%
      span: page
    dawn-small:
      src: examples/magazine-showcase/assets/dawn.svg
      alt: Atlantic dawn
      caption: First light
      fit: cover
      focalPoint: 68% 38%
      span: column
    cliffs-small:
      src: examples/magazine-showcase/assets/cliffs.svg
      alt: Atlantic cliffs
      caption: Weather front
      fit: cover
      focalPoint: 55% 45%
      span: column
    harbor-small:
      src: examples/magazine-showcase/assets/harbor.svg
      alt: Harbour geometry
      caption: Shelter
      fit: cover
      focalPoint: 50% 54%
      span: column

vfm:
  math: true
  mathRenderer: mathml
  footnote: dpub
  rewriteRelativeHrefExtensions: true
  tableCell: align-class

pdf:
  enabled: true
  profile: press
  width: 210mm
  height: 280mm
  binding: left
  bleed: 3mm
  cropMarks: true
  cropOffset: 13mm
  bookmarks: true
  editions:
    - normal
    - print
    - high-quality
  production:
    enabled: true
    preflight: press-ready-local
    preflightOptions:
      - enforce-outline
    cmyk: false

epub:
  enabled: true
  reflowable: false
  layout: fixed
  viewport:
    width: 794
    height: 1058
  orientation: portrait
  spread: auto
  theme: examples/magazine-showcase/theme/epub.css
  themePackages:
    - "@vivliostyle/theme-base@3.0.0"
  embeddedFonts: true

webpub:
  enabled: true

projectZip:
  enabled: true
