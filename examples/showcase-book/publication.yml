version: 2

publication:
  title: The Browser Book
  subtitle: A PubForge showcase of rich PDF, EPUB 3 and Web Publication features
  authors:
    - Equilibrium Press
    - PubForge
  language: en
  type: book
  identifier: urn:pubforge:showcase-book:2026
  publisher: Equilibrium Press
  description: A deliberately feature-rich demonstration publication used to exercise PubForge preview, preflight, PDF, EPUB 3 and Web Publication output.
  subjects:
    - digital publishing
    - EPUB 3
    - paged media
    - Vivliostyle
    - Git-native publishing
  rights: © 2026 Equilibrium Press. Demonstration publication.
  date: 2026-10-04
  readingProgression: ltr

cover:
  image: examples/showcase-book/assets/cover.svg
  alt: Cover of The Browser Book, showing layered pages and a browser window

contents:
  toc: true
  tocTitle: Contents
  sectionDepth: 3
  landmarks: true
  pageList: true

readingOrder:
  - path: examples/showcase-book/content/00-title-page.md
    role: title-page
    title: Title Page
  - path: examples/showcase-book/content/01-copyright.md
    role: copyright
    title: Copyright
  - path: examples/showcase-book/content/02-preface.md
    role: preface
    title: Preface
    breakBefore: recto
  - path: examples/showcase-book/content/03-typography.md
    role: chapter
    title: Typography and Semantics
    breakBefore: recto
    pageCounterReset: 1
  - path: examples/showcase-book/content/04-figures-data.md
    role: chapter
    title: Figures, Tables and Data
    breakBefore: recto
  - path: examples/showcase-book/content/05-math-links.md
    role: chapter
    title: Math, Notes and Cross-References
    breakBefore: recto
  - path: examples/showcase-book/content/06-paged-media.md
    role: chapter
    title: Paged Media
    breakBefore: recto
    theme: examples/showcase-book/theme/paged-media-extra.css
  - path: examples/showcase-book/content/90-appendix.md
    role: appendix
    title: Appendix
    breakBefore: recto
    theme: examples/showcase-book/theme/appendix.css
  - path: examples/showcase-book/content/91-bibliography.md
    role: bibliography
    title: Bibliography
    breakBefore: page
  - path: examples/showcase-book/content/99-colophon.md
    role: colophon
    title: Colophon
    breakBefore: recto

theme:
  preset: showcase-book
  css: examples/showcase-book/theme/publication.css
  packages:
    - "@vivliostyle/theme-base@3.0.0"

assets:
  includes:
    - examples/showcase-book/data/*
  excludes:
    - examples/showcase-book/**/*.tmp
  mermaid: true
  syntaxHighlighting: true
  shikiTheme: github-light
  imageOptimization:
    maxDimension: 1800
    jpegQuality: 0.9
  imagePreflight:
    targetDpi: 300
  editorialImages:
    page-anatomy:
      src: examples/showcase-book/assets/page-anatomy.svg
      alt: Diagram of an A5 page showing bleed, trim, margins, running header and folio
      caption: Page anatomy used by the print theme
      credit: PubForge
      fit: contain
      focalPoint: 50% 50%
      bleed: none
      span: page
      position: full-page
      printWidthMm: 120

vfm:
  math: true
  mathRenderer: mathml
  footnote: dpub
  hardLineBreaks: false
  imgFigcaptionOrder: img-figcaption
  assignIdToFigcaption: true
  captionlessImagePolicy: figure
  parseFigcaptionAsInline: true
  rewriteRelativeHrefExtensions: true
  tableCell: align-class

pdf:
  enabled: true
  profile: press
  size: A5
  binding: left
  bleed: 3mm
  cropMarks: true
  cropOffset: 13mm
  bookmarks: true
  editions:
    - normal
    - print
    - high-quality
  production:
    enabled: true
    preflight: press-ready-local
    preflightOptions:
      - enforce-outline
    cmyk: false

epub:
  enabled: true
  reflowable: true
  theme: examples/showcase-book/theme/epub.css
  themePackages:
    - "@vivliostyle/theme-base@3.0.0"
  embeddedFonts: true

webpub:
  enabled: true

projectZip:
  enabled: true
